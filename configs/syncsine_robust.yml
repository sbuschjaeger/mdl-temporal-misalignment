synthetic: syncsine_robust
models: [cnn, resnet, late_fusion, magnitude_cnn, syncnet]
folds: all
seed: 42
eval_batch_size: 2048
training:
  val_frac: 0.15
  max_epochs: 100
  patience: 10
  batch_size: 256
  lr: 1.0e-4
  num_workers: 4
  precision: 32-true
  p_misalign: 0.0
n_folds: 5
sensor_groups:
  ch0:
  - 0
  ch1:
  - 1
params:
  n_windows: 3000
  window_size: 100
  dt: 0.01
  frequency_threshold: 5.0
  low_frequency_range:
  - 2.0
  - 4.5
  high_frequency_range:
  - 5.5
  - 8.0
  nuisance_frequency_range:
  - 2.0
  - 8.0
  amplitude_range:
  - 0.8
  - 1.2
  noise_std: 0.1
  bias_std: 0.2
  seed: 84
lags: [0, 20, 40, 60, 80, 100, 120, 140, 160, 180, 200, 220, 240, 260, 280, 300, 320, 340, 360, 380, 400, 420, 440, 460, 480, 500, 520, 540, 560, 580, 600, 620, 640, 660, 680, 700, 720, 740, 760, 780, 800, 820, 840, 860, 880, 900, 920, 940, 960, 980, 1000, 1020, 1040, 1060, 1080, 1100, 1120, 1140, 1160, 1180, 1200, 1220, 1240, 1260, 1280, 1300, 1320, 1340, 1360, 1380, 1400, 1420, 1440, 1460, 1480, 1500]
window_length: 100
